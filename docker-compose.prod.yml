version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: pisowifi-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: pisowifi
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - pisowifi-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    container_name: pisowifi-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - pisowifi-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pisowifi-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/pisowifi?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-me}
      QR_PH_API_KEY: ${QR_PH_API_KEY:-}
      QR_PH_API_URL: ${QR_PH_API_URL:-https://api.qrph.com}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - pisowifi-network
    restart: unless-stopped
    healthcheck:
      test: wget -q -O /dev/null http://localhost:5000/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pisowifi-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pisowifi-network
    restart: unless-stopped
    healthcheck:
      test: wget -q -O /dev/null http://localhost/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  mongodb_config:

networks:
  pisowifi-network:
    driver: bridge
